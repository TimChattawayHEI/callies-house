<title>Callie's House</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout: full-bleed isometric house, chips pinned to the corners, sheets slide up from the bottom (side panel on wide screens).
   Deliberately single-theme: the house's warm daylight palette in every viewer theme. Andika is a font made for early readers. */
:root {
  --sand: #efe2d0; --cream: #fffaf0; --ink: #5a3d32; --line: #e2d1b6; --pink: #e86a92; --pink-deep: #c94f7e;
  --mint: #3f9b6e; --gold: #ffd45e; --shadow: rgba(60, 30, 10, .22); --night: #2b2f55;
  --read: 'Andika', 'Trebuchet MS', 'Comic Sans MS', system-ui, sans-serif;
  --display: 'Baloo 2', 'Trebuchet MS', 'Comic Sans MS', system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body { margin: 0; background: var(--sand); color: var(--ink); font-family: var(--read); overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
#app { position: fixed; inset: 0; }
.scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button { font-family: inherit; color: var(--ink); }
button:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }

.hud { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 12px; right: 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: start; gap: 10px; pointer-events: none; }
.hud > * { pointer-events: auto; }
.hud .left { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; min-width: 0; }
.room-chip { font: 700 20px var(--read); background: var(--cream); border: 2px solid var(--line); border-radius: 22px; padding: 4px 16px; box-shadow: 0 3px 0 var(--line); cursor: pointer; }
.meter { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; background: var(--cream); border: 2px solid var(--line); border-radius: 22px; padding: 4px 12px 4px 8px; box-shadow: 0 3px 0 var(--line); }
.meter .cat { display: inline-flex; align-items: center; gap: 2px; font: 700 16px var(--read); font-variant-numeric: tabular-nums; }
.meter .cat.done { color: var(--mint); }
.meter.all { animation: glow 1.2s ease-in-out infinite alternate; }
@keyframes glow { to { box-shadow: 0 3px 0 var(--line), 0 0 0 6px rgba(255, 212, 94, .55); } }
.mid { justify-self: center; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.quest { display: flex; align-items: center; gap: 6px; font: 700 16px var(--read); background: #e6f1fb; border: 2px solid #5b9bd5; border-radius: 16px; padding: 2px 12px 2px 6px; box-shadow: 0 3px 0 #5b9bd5; cursor: pointer; white-space: nowrap; }
.quest.hide { background: #fff1d6; border-color: #e0a92e; box-shadow: 0 3px 0 #e0a92e; padding: 4px 6px 4px 12px; cursor: default; }
.quest.hide .pill { padding: 2px 10px; font-size: 15px; }
.countdown { position: fixed; left: 50%; top: 45%; transform: translate(-50%, -50%); font: 800 clamp(90px, 22vw, 180px) var(--display); color: #fff; text-shadow: 0 6px 0 var(--pink-deep), 0 0 30px rgba(0,0,0,.25); pointer-events: none; animation: pop .3s cubic-bezier(.3, 1.6, .5, 1) both; }
.photo-bar { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; background: var(--cream); border: 3px solid var(--line); border-radius: 22px; padding: 8px 12px; box-shadow: 0 4px 0 var(--line); font: 700 17px var(--read); width: max-content; max-width: calc(100% - 24px); z-index: 3; }
.pmenu { position: fixed; transform: translate(-50%, -100%); display: flex; gap: 6px; align-items: stretch; background: var(--cream); border: 3px solid var(--ink); border-radius: 20px; padding: 6px; box-shadow: 0 5px 0 rgba(90,61,50,.25); z-index: 3; animation: bpop .25s cubic-bezier(.3, 1.6, .5, 1) both; }
.pm { display: flex; flex-direction: column; align-items: center; gap: 2px; border: 2px solid var(--line); background: #fff; border-radius: 14px; padding: 4px 10px; font: 700 15px var(--read); cursor: pointer; }
.pm.close { justify-content: center; font-size: 22px; padding: 0 10px; }
.magnets { position: fixed; inset: 0; background: #e9e1d4; display: flex; flex-direction: column; gap: 8px; padding: calc(10px + env(safe-area-inset-top, 0px)) 12px calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 6; touch-action: none; }
.fridge-door { position: relative; flex: 1; min-height: 0; border-radius: 20px; background: linear-gradient(135deg, #e6eaec, #c9cfd2 60%, #dfe3e5); border: 3px solid #a9afb4; box-shadow: inset 0 0 0 6px rgba(255,255,255,.35); overflow: hidden; }
.fridge-handle { position: absolute; left: 14px; top: 20%; width: 10px; height: 40%; border-radius: 6px; background: #9aa1a6; }
.letter-tray { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; background: #fffaf0; border: 3px solid var(--line); border-radius: 18px; padding: 6px; max-height: 32vh; overflow-y: auto; }
.magnet { font: 700 clamp(34px, 6vw, 52px)/1 var(--read); width: 1.15em; height: 1.15em; display: grid; place-items: center; background: none; border: 0; padding: 0; cursor: grab; text-shadow: 0 3px 0 rgba(0,0,0,.18); touch-action: none; transform: translate(0,0); }
.fridge-door .magnet { transform: translate(-50%, -50%); }
.magnet.dragging { position: fixed; transform: translate(-50%, -50%) scale(1.2); pointer-events: none; z-index: 7; }
.made { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: var(--gold); border: 3px solid #e0a92e; border-radius: 18px; padding: 4px 16px; font: 700 22px var(--read); white-space: nowrap; animation: pop .4s cubic-bezier(.3, 1.6, .5, 1) both; }
.for-who { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; justify-content: center; font: 700 17px var(--read); }
.album .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; overflow-y: auto; min-height: 0; }
.photo-thumb, .photo-big { border: 3px solid #fff; border-radius: 10px; padding: 0; background: #fff; box-shadow: 0 3px 8px var(--shadow); cursor: pointer; }
.photo-thumb img { width: 100%; display: block; aspect-ratio: 4/3; object-fit: cover; border-radius: 6px; }
.photo-big { min-height: 0; flex: 1; display: grid; place-items: center; background: #fffaf0; }
.photo-big img { max-width: 100%; max-height: 60vh; border-radius: 8px; }
.hunt { justify-self: center; font: 700 22px var(--read); background: #fff6c8; border: 3px solid #e0a92e; border-radius: 18px; padding: 4px 16px; box-shadow: 0 4px 0 #e0a92e; cursor: pointer; display: flex; align-items: baseline; gap: 6px; white-space: nowrap; }
.hunt b { font-size: 28px; color: #b5452a; }
.hunt .hunt-n { font: 600 13px var(--display); opacity: .6; margin-left: 4px; }
.hunt.done-all { color: var(--mint); }
.tools { justify-self: end; position: relative; display: flex; gap: 8px; }
.iconbtn { width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--line); background: var(--cream); box-shadow: 0 3px 0 var(--line); display: grid; place-items: center; cursor: pointer; padding: 0; }
.iconbtn:active, .room-chip:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.menu { position: absolute; right: 0; top: 56px; width: 240px; background: var(--cream); border: 2px solid var(--line); border-radius: 18px; box-shadow: 0 4px 0 var(--line), 0 12px 30px var(--shadow); padding: 12px; display: flex; flex-direction: column; gap: 8px; z-index: 5; }
.menu p { margin: 0; font: 700 15px var(--display); }
.pair { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { font: 700 16px var(--read); background: #fff; border: 2px solid var(--line); border-radius: 999px; padding: 6px 16px; cursor: pointer; }
.pill.warn { background: var(--pink); border-color: var(--pink-deep); color: #fff; }

.bubbles { position: fixed; inset: 0; pointer-events: none; }
.bubble { position: absolute; transform: translate(-50%, calc(-100% - 14px)); max-width: min(340px, 80vw); background: #fff; border: 3px solid var(--ink); border-radius: 22px; padding: 6px 12px; box-shadow: 0 4px 0 rgba(90, 61, 50, .25); pointer-events: auto; animation: bpop .3s cubic-bezier(.3, 1.6, .5, 1) both; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.bubble::after { content: ''; position: absolute; left: 50%; bottom: -14px; width: 18px; height: 18px; background: #fff; border-right: 3px solid var(--ink); border-bottom: 3px solid var(--ink); transform: translateX(-50%) rotate(45deg); border-radius: 0 0 4px 0; }
.bubble.shout { background: #fff6c8; border-color: #b5452a; }
.bubble.shout::after { background: #fff6c8; border-color: #b5452a; }
.bubble.muffled { background: #eef0f4; border-style: dashed; opacity: .95; }
.bubble.muffled::after { background: #eef0f4; }
.bubble.off { position: relative; transform: none; flex-direction: row; gap: 8px; margin-top: 4px; }
.bubble.off::after, .bubble[style] .who + .words { }
.bubble.off::after { display: none; }
.bubble .who { display: flex; align-items: center; gap: 4px; font: 700 13px var(--display); opacity: .75; }
.bubble .words { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 6px; }
.bubble .w { font: 700 26px/1.25 var(--read); background: none; border: 0; padding: 0 1px; border-radius: 6px; cursor: pointer; }
.bubble .w.on { background: #ffe27a; }
.bubble .w:active { background: #ffe27a; }
@keyframes bpop { from { opacity: 0; transform: translate(-50%, calc(-100% - 4px)) scale(.6); } to { opacity: 1; } }

.bottom { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: flex-end; gap: 10px; pointer-events: none; }
.bottom > * { pointer-events: auto; }
.pack-btn, .dress-btn { position: relative; width: 64px; height: 64px; border-radius: 22px; border: 3px solid var(--line); background: var(--cream); box-shadow: 0 4px 0 var(--line); display: grid; place-items: center; cursor: pointer; padding: 0; flex: none; }
.pack-btn.active { border-color: var(--pink); }
.dress-btn { margin-left: 0; }
.who-pick { margin: 0 auto; display: flex; gap: 4px; background: var(--cream); border: 3px solid var(--line); border-radius: 22px; padding: 4px; box-shadow: 0 4px 0 var(--line); min-width: 0; }
.who { width: 52px; border: 2px solid transparent; background: none; border-radius: 16px; display: flex; flex-direction: column; align-items: center; padding: 2px 0 0; cursor: pointer; }
.who small { font: 700 12px var(--read); margin-top: -2px; }
.who[aria-pressed="true"] { background: #ffe1ec; border-color: var(--pink); }
.pack-btn .count { position: absolute; right: -6px; top: -6px; min-width: 24px; height: 24px; border-radius: 12px; background: var(--pink); color: #fff; font: 800 15px/24px var(--display); }
.tray { position: absolute; left: 0; bottom: 78px; display: flex; gap: 6px; flex-wrap: wrap; align-content: flex-start; background: var(--cream); border: 3px solid var(--line); border-radius: 22px; padding: 6px; box-shadow: 0 4px 0 var(--line); width: max-content; max-width: min(calc(100vw - 180px), 568px); max-height: min(55vh, 330px); overflow-y: auto; min-width: 0; box-sizing: border-box; }
.tray-head { flex: 0 0 100%; display: flex; justify-content: space-between; align-items: center; padding: 0 6px; font: 800 15px var(--display); color: var(--ink); }
.tray-head .full { color: var(--pink); }
.slot { width: 64px; height: 70px; border-radius: 14px; border: 2px solid var(--line); background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
.slot[aria-pressed="true"] { border-color: var(--pink); box-shadow: 0 0 0 3px var(--pink); }
.slot small { font: 700 13px var(--read); margin-top: -4px; }
.empty { font: 700 16px var(--read); padding: 8px 10px; }

.hint, .hint-sel { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(560px, calc(100% - 32px)); text-align: center; background: var(--cream); border: 2px solid var(--line); border-radius: 20px; box-shadow: 0 3px 0 var(--line); padding: 8px 14px; font: 700 17px/1.35 var(--read); pointer-events: none; }
.hint-sel { background: #ffe1ec; border-color: var(--pink); pointer-events: auto; }
.read-it { margin-left: 8px; background: var(--pink); color: #fff; border-color: var(--pink-deep); }
.goodnight { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 6px; color: #fff6d8; font: 700 clamp(28px, 6vw, 46px) var(--read); text-align: center; pointer-events: auto; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
.toast { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); background: var(--gold); font: 800 clamp(26px, 6vw, 44px) var(--read); padding: 8px 26px; border-radius: 28px; border: 3px solid #e0a92e; box-shadow: 0 5px 0 #e0a92e, 0 16px 40px var(--shadow); pointer-events: none; white-space: nowrap; animation: pop .5s cubic-bezier(.3, 1.6, .5, 1) both; }
@keyframes pop { from { opacity: 0; transform: translate(-50%, 0) scale(.5); } to { opacity: 1; transform: translate(-50%, 0) scale(1); } }

.quest.spooky { background: #ffe8cf; border-color: #e0761a; box-shadow: 0 3px 0 #e0761a; }
.pumpkin-panel { overflow-y: auto; }
.pumpkin-body { display: flex; gap: 14px; align-items: center; justify-content: center; flex-wrap: wrap; }
.pumpkin-view { display: flex; flex-direction: column; align-items: center; gap: 8px; border-radius: 22px; padding: 8px; background: #fff3e2; transition: background .3s; }
.pumpkin-view.lit { background: #241a33; }
.pumpkin-parts { display: flex; flex-direction: column; gap: 8px; align-items: stretch; min-width: 0; }
.part-row { display: flex; align-items: center; gap: 8px; }
.part-name { font: 700 20px var(--read); width: 64px; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink); }
.part-opts { display: flex; flex-wrap: wrap; gap: 6px; }
.tile.part { width: 76px; height: 50px; padding: 0; overflow: hidden; background: #f28a1c; }
.tile.part svg { width: 100%; height: 100%; }
.tile.part[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--ink); }
.pumpkin-parts .done:disabled { opacity: .55; }
.townmap { position: fixed; inset: 0; z-index: 8; background: #efe2d0; display: flex; flex-direction: column; animation: mapin .3s ease both; }
@keyframes mapin { from { opacity: 0; } to { opacity: 1; } }
.townmap svg { flex: 1; min-height: 0; width: 100%; display: block; cursor: pointer; }
.map-scroll { flex: 1; min-height: 0; display: flex; overflow: auto; -webkit-overflow-scrolling: touch; }
.map-scroll svg { flex: none; width: 100%; height: 100%; }
.map-scroll.tall svg { width: 250%; }
@media (max-width: 560px) { .map-bar { white-space: normal; flex-wrap: wrap; justify-content: center; max-width: calc(100% - 20px); padding: 8px 10px; } .map-bar .map-word.small { font-size: 18px; text-align: center; } }
.map-bar { position: absolute; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; align-items: center; gap: 12px; background: var(--cream); border: 3px solid var(--line); border-radius: 26px; box-shadow: 0 6px 0 var(--line); padding: 8px 12px 8px 18px; white-space: nowrap; }
.map-word { font: 700 34px var(--read); color: var(--ink); background: none; border: 0; padding: 0 4px; cursor: pointer; }
.map-word.small { font-size: 24px; }
.map-note { font: 700 18px var(--read); color: var(--ink); opacity: .7; }
.done.go { font-size: 26px; padding: 8px 26px; }
.menu-sheet { overflow-y: auto; }
.menu-grid { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.tile.menu-item { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 104px; height: 104px; gap: 0; padding: 4px; }
.tile.menu-item.on-list { border-color: #e0a92e; box-shadow: 0 0 0 3px #ffd45e; }
.mi-word { font: 700 17px/1.1 var(--read); color: var(--ink); text-align: center; }
.mi-price { font: 700 14px var(--read); color: #2f6f6a; }

.menu-foot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
.tray-row { display: flex; gap: 4px; align-items: center; min-height: 44px; background: #fff; border: 2px dashed var(--line); border-radius: 14px; padding: 2px 8px; }
.tray-thing { background: none; border: 0; padding: 0; cursor: pointer; display: grid; }
.price-total { font: 700 26px var(--read); color: #2f6f6a; background: #e6f4f1; border: 2px solid #2f6f6a; border-radius: 14px; padding: 2px 14px; cursor: pointer; }
.basket-label { font: 700 18px var(--read); color: var(--ink); }
.done:disabled { opacity: .5; }
.shop-list { display: flex; align-items: center; gap: 6px; background: #fffaf0; border: 2px solid #3f8a5a; border-radius: 16px; padding: 2px 10px; box-shadow: 0 3px 0 #3f8a5a; cursor: pointer; font: 700 16px var(--read); color: var(--ink); }
.shop-list .li { display: flex; align-items: center; gap: 2px; }
.shop-list .li.got span { text-decoration: line-through; opacity: .55; }
.shop-list .li.got svg { opacity: .55; }
.till-list { display: flex; flex-direction: column; gap: 2px; max-height: 34vh; overflow-y: auto; padding: 0 8px; }
.till-line { display: flex; align-items: center; gap: 8px; font: 700 18px var(--read); color: var(--ink); animation: slide .25s ease both; }
.till-line b { margin-left: auto; color: #2f6f6a; }
.who.away { opacity: .35; }
.sheet { position: fixed; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(820px, calc(100% - 24px)); max-height: min(76vh, 640px); background: var(--cream); border: 3px solid var(--line); border-radius: 28px; box-shadow: 0 6px 0 var(--line), 0 24px 50px var(--shadow); display: flex; flex-direction: column; gap: 10px; padding: 12px; animation: rise .3s ease both; overflow: hidden; z-index: 4; }
@keyframes rise { from { opacity: 0; transform: translate(-50%, 20px); } to { opacity: 1; transform: translate(-50%, 0); } }
.tabs { display: flex; gap: 6px; overflow-x: auto; flex: none; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 0; border: 2px solid var(--line); background: #fff; border-radius: 16px; padding: 4px 8px; cursor: pointer; font: 700 14px var(--read); flex: none; }
.tab[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 2px var(--ink); }
.dress-body { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 14px; min-height: 0; flex: 1; }
.preview { display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 8px; background: radial-gradient(circle at 50% 40%, #fbe4ec, #f3e3cf 70%); border-radius: 20px; padding: 8px; min-height: 0; }
.preview svg { width: 100%; flex: 1; min-height: 0; }
.done { font: 800 22px var(--display); color: #fff; background: var(--pink); border: 3px solid var(--pink-deep); border-radius: 999px; padding: 2px 26px; box-shadow: 0 4px 0 var(--pink-deep); cursor: pointer; }
.done:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--pink-deep); }

.sw { width: 42px; height: 42px; border-radius: 50%; border: 3px solid #fff; background: var(--c); box-shadow: 0 0 0 2px var(--line); cursor: pointer; padding: 0; transition: transform .15s; }
.sw.big { width: 46px; height: 46px; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--ink); transform: scale(1.1); }
.tile { min-width: 54px; height: 54px; border-radius: 14px; border: 2px solid var(--line); background: #fff; display: grid; place-items: center; cursor: pointer; padding: 0 4px; }
.tile[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 2px var(--ink); }
.box-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.box-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; overflow-y: auto; min-height: 0; }
.box-cols h3 { margin: 0 0 6px; font: 700 18px var(--read); }
.slots { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.fridge-body { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.tile.food { flex-direction: column; display: flex; height: 70px; min-width: 70px; width: auto; padding: 0 6px; font: 700 16px var(--read); gap: 0; align-items: center; justify-content: center; }
.paint { position: fixed; inset: 0; background: #f3e3cf; display: flex; flex-direction: column; gap: 8px; padding: calc(10px + env(safe-area-inset-top, 0px)) 12px calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 6; }
.paint-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.paint-title { font: 800 28px var(--display); }
.paint-btns { display: flex; gap: 8px; align-items: center; }
.canvas { flex: 1; min-height: 0; width: 100%; object-fit: contain; background: #fffdf6; border-radius: 18px; border: 3px solid var(--line); touch-action: none; cursor: crosshair; }
.palette { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }
